# Nginx Reverse Proxy Configuration for Vishwaguru Billing
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Static files served directly by Nginx
    location /static/ {
        alias /home/ubuntu/vishwaguru-billing/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files (e.g. logos)
    location /media/ {
        alias /home/ubuntu/vishwaguru-billing/media/;
        expires 30d;
    }

    # Pass all other requests to Gunicorn WSGI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
